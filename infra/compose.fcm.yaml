# Optional overlay: securely mount an existing service-account file without copying it.
services:
  web:
    environment:
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
    volumes:
      - ${FCM_SERVICE_ACCOUNT_FILE_HOST:?Set a secure service-account file path}:/run/secrets/firebase-service-account.json:ro
  queue:
    environment:
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
    volumes:
      - ${FCM_SERVICE_ACCOUNT_FILE_HOST:?Set a secure service-account file path}:/run/secrets/firebase-service-account.json:ro
